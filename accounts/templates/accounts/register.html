{% extends 'base.html' %}
{% block title %}Register | EasyDoesIt{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg shadow p-6 mt-10">
    <h1 class="text-xl font-bold mb-6">Create an account</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-red-600 text-sm mt-1">{{ field.errors.0 }}</p>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="w-full bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Register</button>
    </form>
    <p class="text-sm text-gray-500 mt-4">Already have an account? <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Log in</a></p>
</div>
{% endblock %}
